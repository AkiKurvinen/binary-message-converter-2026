<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Binary Message Converter</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>
  <main>
    <div class="layout">
      <form id="transmitter-form">
        <h1>Message Converter</h1>
        <fieldset id="settings">

          <legend>Frame settings</legend>
          <label for="sync-byte">Start byte <span>8 binary digits</span></label>
          <input id="sync-byte" name="sync-byte" type="text" value="11001100" pattern="[01]{8}" maxlength="8" required
            spellcheck="false">

          <label for="message">Message <span>Extended ASCII</span></label>
          <textarea id="message" name="message" rows="3" spellcheck="false">Moro</textarea>

          <label for="color-mode">Color mode</label>
          <select id="color-mode" name="color-mode">
            <option value="HUE_RG">Red / Green</option>
            <option value="HUE_GB">Green / Blue</option>
            <option value="HUE_BR">Blue / Red</option>
            <option value="LIGHTNESS" selected>Bright / Dark</option>
          </select>

          <div class="timings">
            <div>
              <label for="interval">Bit duration <span>ms</span></label>
              <input id="interval" name="interval" type="number" value="1000" min="1" max="60000" step="1" required>
            </div>
            <div>
              <label for="gap">Dark gap <span>ms</span></label>
              <input id="gap" name="gap" type="number" value="0" min="0" max="59999" step="1" required>
            </div>
          </div>
          <p class="hint">The dark gap is part of each bit's duration.</p>
        </fieldset>
        <div class="actions">
          <button id="start" type="submit">Start transmitting</button>
          <button id="stop" type="button" class="secondary" disabled>Stop</button>
        </div>
        <p id="error" class="error" role="alert"></p>
      </form>

      <section class="output" aria-labelledby="output-title">
        <div class="output-heading">
          <div>
            <p class="eyebrow">Live output</p>
            <h2 id="output-title">Color swatch</h2>
          </div>
          <span id="status" class="status" role="status">Stopped</span>
        </div>
        <div id="swatch" class="swatch" aria-label="Color swatch, currently dark"></div>
        <div class="bit-row">
          <span id="position">Ready to transmit</span>
          <strong id="bit">—</strong>
        </div>
        <p class="hint">Message text as binary (extended ASCII)<code id="message-bits" class="binary-preview"></code></p>
        <p class="hint">The frame starts with the start byte, followed by the message bytes, most significant bit first.
        </p>
      </section>
    </div>
  </main>
</body>

</html>
